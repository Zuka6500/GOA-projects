<html>
<head>
    <title>რეგისტრაცია</title>
</head>
<body>

    <h1>რეგისტრაცია</h1>

    <form>
        <label>სახელი:</label>
        <input type="text" placeholder="შეიყვანე სახელი">
        <br><br>

        <label>გვარი:</label>
        <input type="text" placeholder="შეიყვანე გვარი">
        <br><br>

        <label>ასაკი:</label>
        <input type="number" placeholder="შეიყვანე ასაკი">
        <br><br>

        <p>აირჩიე ძაღლის ჯიში:</p>

        <input type="radio" name="dog"> ჰასკი
        <br>
        <input type="radio" name="dog"> ოქროსფერი რეტრივერი
        <br>
        <input type="radio" name="dog"> ლაბრადორი
        <br>
        <input type="radio" name="dog"> მალტიპუ
        <br><br>

            <label for="movie">აირჩიე საყვარელი ფილმი:</label>
        <select id="movie">
            <option>Scarface</option>
            <option>The Godfather</option>
            <option>Bronx Tale</option>
            <option>Titanic</option>
        </select>
        <br><br>

        <button type="submit">რეგისტრაცია</button>
    </form>

</body>
</html>
