<!-- radio input გამოიყენება მაშინ,როცა მომხმარებელმა მხოლოდ ერთი ვარიანტი უნდა აირჩიოს. მაგალითად სქესის არჩევა, გადახდოს მეთოდი და რაიმე ფილმების არჩევა.-->
<!-- select გამოიყენება ჩამოსაშლელი სიისთვის. მაგალითად ქვეყნის არჩევა, ქალაქის არჩევა და რაიმე სხვა ვარიანტები.-->
<html>
<head>
    <title>Gender Form</title>
</head>
<body>

    <h2>აირჩიეთ სქესი</h2>

    <form>
        <p>აირჩიე სქესი:</p>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
