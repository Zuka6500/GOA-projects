<html>
<head>
    <title>ტელეფონების ვებსაიტი</title>
</head>
<body>

    <h1>ტელეფონების მაღაზია</h1>

    <p>
        კეთილი იყოს თქვენი მობრძანება ჩვენი ტელეფონების საიტზე.
    </p>

    <h2>iPhone 16 Pro</h2>
    <p>ფასი: 3500 ლარი</p>

    <form>
        <label for="name">თქვენი სახელი:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <p>აირჩიეთ ფერი:</p>

        <input type="radio" id="black" name="color" value="Black">
        <label for="black">Black</label>
        <br>

        <input type="radio" id="white" name="color" value="White">
        <label for="white">White</label>
        <br>

        <input type="radio" id="blue" name="color" value="Blue">
        <label for="blue">Blue</label>
        <br><br>

        <label for="storage">აირჩიეთ მეხსიერება:</label>
        <select id="storage" name="storage">
            <option value="128gb">128GB</option>
            <option value="256gb" selected>256GB</option>
            <option value="512gb">512GB</option>
            <option value="1tb">1TB</option>
        </select>
        <br><br>

        <button type="submit">ყიდვა</button>
    </form>

</body>
</html>
